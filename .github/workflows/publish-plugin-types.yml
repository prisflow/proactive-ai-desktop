name: Publish plugin-types

on:
  push:
    branches:
      - main
    paths:
      - "plugin-types/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # trusted publishing（npmjs 侧已绑定本 workflow 的 OIDC）：
      # setup-node 配 registry-url 时会注入无效的 NODE_AUTH_TOKEN（占位），
      # 它会让 npm 优先用 token 而放弃 OIDC。用 env -u 移除后 npm 走 OIDC（id-token:write）。
      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: plugin-types
        run: env -u NODE_AUTH_TOKEN npm publish --access public --provenance
