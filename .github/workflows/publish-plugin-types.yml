name: Publish plugin-types

on:
  push:
    branches:
      - main
    paths:
      - "plugin-types/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # 经典 token 认证（NPM_TOKEN secret）发布。
      # setup-node 配 registry-url 后注入 NODE_AUTH_TOKEN，npm 用它认证 registry。
      - name: Publish to npm
        working-directory: plugin-types
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
