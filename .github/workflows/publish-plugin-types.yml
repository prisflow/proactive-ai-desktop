name: Publish plugin-types

on:
  push:
    branches:
      - main
    paths:
      - "plugin-types/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # trusted publishing：npmjs 侧已绑定本 workflow 的 OIDC，
      # npm publish 时自动交换 token，无需 NPM_TOKEN secret。
      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: plugin-types
        run: npm publish --access public --provenance
