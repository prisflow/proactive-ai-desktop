name: Publish plugin-types

on:
  push:
    branches:
      - main
    paths:
      - "plugin-types/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # trusted publishing（npmjs 侧已绑定本 workflow 的 OIDC）：
      # 1) setup-node 会注入占位 NODE_AUTH_TOKEN，用 env -u 移除让 npm 走 OIDC（id-token:write）
      # 2) 升级 npm 到 11：Node 20 自带 npm 10 对 scoped 包的 trusted publishing (OIDC) 有 404 bug
      #    （见 npm/cli issues #8730 / #8976），npm 11 已修复。
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: plugin-types
        run: env -u NODE_AUTH_TOKEN npm publish --access public --provenance
