name: Publish plugin-types

on:
  push:
    branches:
      - main
    paths:
      - "plugin-types/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # trusted publishing（npmjs 侧已绑定本 workflow 的 OIDC）：
      # 保留 registry-url 让 npm 识别 npmjs registry；不注入任何 NODE_AUTH_TOKEN，
      # npm 会利用 id-token:write 自动交换 OIDC token（npm >= 9.6.10）。
      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: plugin-types
        run: npm publish --access public --provenance
