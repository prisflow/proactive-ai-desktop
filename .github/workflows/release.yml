name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-cache winCodeSign (skip mac/linux symlinks)
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron-builder\Cache\winCodeSign"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $zip = Join-Path $cache "winCodeSign-2.6.0.7z"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z" -OutFile $zip -UseBasicParsing
          }
          # 排除 darwin/linux（Windows 打包不需要），避免 symlink 创建权限问题
          $seven = Get-ChildItem "$env:GITHUB_WORKSPACE\node_modules\.pnpm\7zip-bin*\node_modules\7zip-bin\win\x64\7za.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $seven) {
            Write-Error "7za not found"
          }
          if ($seven) {
            & $seven.FullName x -y "-o$cache" $zip "-x!darwin/*" "-x!linux/*" | Out-Null
            Write-Output "winCodeSign pre-extracted to $cache"
          }

      - name: Build
        run: pnpm run build

      - name: Package (Windows)
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
